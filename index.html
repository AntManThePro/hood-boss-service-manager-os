<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><meta name="theme-color" content="#00ff87"/><link rel="manifest" href="./manifest.webmanifest"/><link rel="icon" href="./icon.svg"/><title>HOOD BOSS // SERVICE MANAGER OS</title><style>:root{--g:#00ff87;--c:#60efff;--p:#ff0080;--y:#ffcc00;--bg:#0a0a0f;--panel:#0d0d14;--bd:#1a1a2e}*{box-sizing:border-box}html,body{margin:0;background:#0a0a0f;color:#e8e8f0;font-family:system-ui,sans-serif}h1{background:linear-gradient(90deg,#00ff87,#60efff);-webkit-background-clip:text;background-clip:text;color:transparent}.shell{max-width:1100px;margin:0 auto;padding:16px 16px 80px}.btn{border:1px solid #1a1a2e;background:transparent;color:#b0b0c8;border-radius:8px;padding:8px 12px;cursor:pointer}.pri{background:#00ff87;color:#04120a;border:0}.card{background:#0d0d14;border:1px solid #1a1a2e;border-radius:12px;padding:14px;margin:10px 0}.chip{padding:6px 10px;border:1px solid #1a1a2e;border-radius:8px;background:#111;color:#9a9ab0;margin-right:4px}.on{border-color:#00ff87;color:#00ff87}.task{padding:8px;background:#111;margin:6px 0;border-radius:8px;cursor:pointer}.done{opacity:.55;text-decoration:line-through}.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}.metric{background:#0d0d14;border:1px solid #1a1a2e;border-radius:10px;padding:10px}.metric strong{display:block;font-size:22px;color:#00ff87}.tabs button{background:0;border:0;color:#8a8aa0;padding:8px}.tabs .on{color:#00ff87}form label{display:block;margin:8px 0;font-size:12px;color:#9a9ab0}input,select,textarea{width:100%;background:#15151f;border:1px solid #2a2a3a;color:#fff;padding:8px;border-radius:6px}.hid{display:none}canvas{width:100%;height:150px;background:#08080e;border-radius:8px}nav.bot{position:fixed;left:0;right:0;bottom:0;background:#000;border-top:2px solid #00ff87;display:flex;justify-content:space-around;padding:10px}dialog{background:#0d0d14;color:#fff;border:1px solid #1a1a2e;border-radius:12px}</style></head><body><div class="shell"><p style="color:#00ff87;letter-spacing:.2em;font-size:11px">NEXUS · NExtended Xperimental USers · DoubleA · AntManThePro</p><h1>HOOD BOSS // SERVICE MANAGER OS</h1><p id="lockState">LOCKED</p><button class="btn" id="unlockBtn">Unlock</button><button class="btn hid" id="lockBtn">Lock</button><div class="metrics"><div class="metric"><span>Week</span><strong id="weekPct">0%</strong></div><div class="metric"><span>Visits</span><strong id="visitsMetric">0</strong></div><div class="metric"><span>Coaching</span><strong id="coachMetric">0</strong></div><div class="metric"><span>Open</span><strong id="actionsMetric">0</strong></div></div><div class="card"><div id="dayStrip"></div><h3 id="missionHeadline"></h3><p id="missionDetail"></p><div id="taskList"></div><canvas id="opsMesh"></canvas></div><div class="card"><button class="btn pri" data-tab="coaching">Log Coaching</button> <button class="btn pri" data-tab="visits">Log Visit</button> <button class="btn" data-tab="actions">Add Action</button><p id="focusText"></p></div><div class="card tabs" id="tabBar"><button class="on" data-tab="activity">Activity</button><button data-tab="coaching">Coaching</button><button data-tab="visits">Visits</button><button data-tab="actions">Actions</button></div><div id="panel-activity"><div id="activityList"></div></div><div id="panel-coaching" class="hid"><form id="coachingForm"><label>Employee<input id="coachName" required></label><label>Topic<select id="coachTopic"><option>Safety</option><option>Quality</option><option>Leadership</option></select></label><label>Notes<textarea id="coachNotes"></textarea></label><button class="btn pri">Save coaching</button></form><div id="coachingList"></div></div><div id="panel-visits" class="hid"><form id="visitForm"><label>Crew<input id="visitCrew" required></label><label>Focus<select id="visitFocus"><option>QA</option><option>Safety</option></select></label><label>Notes<textarea id="visitNotes"></textarea></label><button class="btn pri">Save visit</button></form><div id="visitsList"></div></div><div id="panel-actions" class="hid"><form id="actionForm"><label>Action<input id="actionTitle" required></label><label>Owner<input id="actionOwner"></label><button class="btn pri">Save action</button></form><div id="actionList"></div></div><p><button class="btn" id="exportJsonBtn">Export JSON</button> <button class="btn" id="importBtn">Import</button> <input id="importInput" type="file" accept="application/json" class="hid"><button class="btn" id="clearWeekBtn">Reset Week</button></p><textarea id="payloadOut" class="hid" style="width:100%;min-height:80px;background:#08080e;color:#9ad"></textarea></div><nav class="bot"><button class="btn" id="voiceBtn">Voice</button><button class="btn" id="unlockBtn2">Unlock</button></nav><dialog id="authDialog"><form id="authForm"><p>Password: BudaOps1!</p><input id="passwordInput" type="password" required><p id="authError" style="color:#ff0080"></p><button class="btn pri">Unlock</button><button class="btn" type="button" id="authCancel">Cancel</button></form></dialog><script src="./app.js"></script></body></html>
